<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
      }
      #startBtn {
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      }
      #promptText {
        color: #fff;
        font-family: sans-serif;
        margin-top: 15px;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <button id="startBtn">Tap to Start AR</button>
      <p id="promptText">Grant camera permission when asked</p>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: yes; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Card Deck Video -->
        <video
          id="cardVid"
          src="./video.mp4"
          preload="none"
          loop
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
        ></video>

        <!-- Spider Video -->
        <video
          id="spiderVid"
          src="./spider.mp4"
          preload="none"
          loop
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Queen Playing Card (Image 1 in Compiler) -->
      <a-entity id="targetCard" mindar-image-target="targetIndex: 0">
        <a-video
          src="#cardVid"
          position="0 0 0"
          width="1"
          height="1.40"
          rotation="0 0 0"
        ></a-video>
      </a-entity>

      <!-- Target 1: Spider / Man Standing (Image 2 in Compiler) -->
      <a-entity id="targetSpider" mindar-image-target="targetIndex: 1">
        <a-video
          src="#spiderVid"
          position="0 0 0"
          width="1"
          height="0.418"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const cardVid = document.getElementById('cardVid');
      const spiderVid = document.getElementById('spiderVid');

      const targetCard = document.getElementById('targetCard');
      const targetSpider = document.getElementById('targetSpider');

      startBtn.addEventListener('click', () => {
        // Unlock autoplay permissions
        cardVid.play().then(() => cardVid.pause()).catch(() => {});
        spiderVid.play().then(() => spiderVid.pause()).catch(() => {});
        overlay.style.display = 'none';
      });

      // Target 0: Queen Card Events
      targetCard.addEventListener('targetFound', () => {
        cardVid.play();
      });
      targetCard.addEventListener('targetLost', () => {
        cardVid.pause();
      });

      // Target 1: Spider Image Events
      targetSpider.addEventListener('targetFound', () => {
        spiderVid.play();
      });
      targetSpider.addEventListener('targetLost', () => {
        spiderVid.pause();
      });
    </script>
  </body>
</html>
