<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AR Video Reveal</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 999;
    background: #000; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  #startOverlay h1 { font-size: 20px; margin-bottom: 8px; }
  #startOverlay p { font-size: 14px; opacity: .7; margin-bottom: 24px; max-width: 320px; }
  #startBtn {
    padding: 14px 34px; font-size: 16px; border: none; border-radius: 30px;
    background: #ff2d55; color: #fff; font-weight: bold; cursor: pointer;
  }
  #hint {
    position: fixed; bottom: 20px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 13px; opacity: .8; z-index: 10; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .a-enter-vr { display: none !important; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>AR Video Reveal</h1>
  <p>Point your camera at the Queen of Clubs card or the crowd photo to see the video play on top of it.</p>
  <button id="startBtn">Start Camera</button>
</div>

<div id="hint">Scanning for target…</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>

  <a-assets>
    <!-- targetIndex 0: Queen of Clubs card -->
    <video id="video-card" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
    <!-- targetIndex 1: crowd / spider-man photo -->
    <video id="video-crowd" src="./spider.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <!-- TARGET 0: Queen of Clubs card (portrait, standard card ratio ~0.714:1) -->
  <a-entity id="target0" mindar-image-target="targetIndex: 0">
    <a-video
      src="#video-card"
      width="1"
      height="1.4"
      position="0 0 0"
      rotation="0 0 0">
    </a-video>
  </a-entity>

  <!-- TARGET 1: crowd / spider-man photo (landscape, widescreen still ~1.78:1) -->
  <a-entity id="target1" mindar-image-target="targetIndex: 1">
    <a-video
      src="#video-crowd"
      width="1"
      height="0.5625"
      position="0 0 0"
      rotation="0 0 0">
    </a-video>
  </a-entity>

</a-scene>

<script>
  const sceneEl = document.querySelector('a-scene');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');

  const videoCard = document.getElementById('video-card');
  const videoCrowd = document.getElementById('video-crowd');
  const target0 = document.getElementById('target0');
  const target1 = document.getElementById('target1');

  function wireTarget(targetEl, videoEl, label) {
    targetEl.addEventListener('targetFound', () => {
      hint.textContent = label + ' found';
      videoEl.currentTime = 0;
      videoEl.play();
    });
    targetEl.addEventListener('targetLost', () => {
      hint.textContent = 'Scanning for target…';
      videoEl.pause();
    });
  }

  wireTarget(target0, videoCard, 'Card');
  wireTarget(target1, videoCrowd, 'Crowd photo');

  // Wait for a real tap before starting camera/AR — this also unlocks
  // audio playback on iOS/Android so the videos can play WITH sound.
  startBtn.addEventListener('click', () => {
    startOverlay.style.display = 'none';
    const arSystem = sceneEl.systems['mindar-image'];
    arSystem.start(); // starts camera + tracking
  });
</script>

</body>
</html>
